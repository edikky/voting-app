name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY_USER: edikky

jobs:
  test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the app
        run: docker compose up -d --build
      - name: Check vote and result pages respond
        run: |
          for port in 8080 8081; do
            for i in $(seq 1 30); do
              if curl -sf http://localhost:$port > /dev/null; then
                echo "port $port OK"; break
              fi
              if [ $i -eq 30 ]; then
                echo "port $port failed"; docker compose logs; exit 1
              fi
              sleep 3
            done
          done
      - name: Stop the app
        if: always()
        run: docker compose down

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  build-and-push:
    name: Build and Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/examplevotingapp_${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY_USER }}/examplevotingapp_${{ matrix.service }}:latest
            
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Check the cluster exists
        id: cluster
        run: |
          if aws eks describe-cluster --name edikky-voting-cluster > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Cluster not found, skipping deploy"
          fi
      - name: Connect kubectl
        if: steps.cluster.outputs.exists == 'true'
        run: aws eks update-kubeconfig --name edikky-voting-cluster --region us-east-1
      - name: Deploy with Helm
        if: steps.cluster.outputs.exists == 'true'
        run: helm upgrade --install voting ./helm/voting-app -n voting --set global.tag=${{ github.sha }} --wait --timeout 3m
