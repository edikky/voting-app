name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY_USER: edikky

jobs:
  test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the app
        run: docker compose up -d --build
      - name: Check vote and result pages respond
        run: |
          for port in 8080 8081; do
            for i in $(seq 1 30); do
              if curl -sf http://localhost:$port > /dev/null; then
                echo "port $port OK"; break
              fi
              if [ $i -eq 30 ]; then
                echo "port $port failed"; docker compose logs; exit 1
              fi
              sleep 3
            done
          done
      - name: Stop the app
        if: always()
        run: docker compose down

  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  build-and-push:
    name: Build and Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/examplevotingapp_${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY_USER }}/examplevotingapp_${{ matrix.service }}:latest
            